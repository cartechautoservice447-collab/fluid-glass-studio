name: Publish Liquid Glass Studio Web PWA Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-web-pwa-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production web app
        run: npm run build

      - name: Verify web install assets
        shell: bash
        run: |
          # The production build emits static web assets into dist/client.
          test -f dist/client/manifest.webmanifest
          test -f dist/client/pwa-icon-exact-192-new.png
          test -f dist/client/pwa-icon-exact-512-new.png
          test -f dist/client/pwa-icon-maskable-512.png
          test -f dist/client/sw.js
          grep -q 'pwa-icon-exact-192-new.png' dist/client/manifest.webmanifest
          grep -q 'pwa-icon-exact-512-new.png' dist/client/manifest.webmanifest
          grep -q 'pwa-icon-maskable-512.png' dist/client/manifest.webmanifest
          python3 - <<'PY'
          import struct, sys

          def png_size(path):
              with open(path, 'rb') as handle:
                  header = handle.read(24)
              assert header[:8] == b'\x89PNG\r\n\x1a\n', f'{path} is not a PNG'
              return struct.unpack('>II', header[16:24])

          expected = {
              'dist/client/pwa-icon-exact-192-new.png': (192, 192),
              'dist/client/pwa-icon-exact-512-new.png': (512, 512),
              'dist/client/pwa-icon-maskable-512.png': (512, 512),
          }
          for path, size in expected.items():
              actual = png_size(path)
              assert actual == size, f'{path} is {actual}, expected {size}'
              # Guard against truncated uploads: a valid icon ends with IEND.
              with open(path, 'rb') as handle:
                  handle.seek(-12, 2)
                  assert handle.read()[4:8] == b'IEND', f'{path} is truncated'
          print('web install icons verified')
          PY

      - name: Create full web PWA bundle
        shell: bash
        run: |
          rm -rf release
          mkdir -p release
          cd dist/client
          zip -r ../../release/Liquid-Glass-Studio-Web-PWA.zip .
          cd ../..
          test -s release/Liquid-Glass-Studio-Web-PWA.zip

      - name: Create or update web release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view web-latest >/dev/null 2>&1; then
            gh release upload web-latest release/Liquid-Glass-Studio-Web-PWA.zip --clobber
          else
            gh release create web-latest \
              release/Liquid-Glass-Studio-Web-PWA.zip \
              --title "Liquid Glass Studio Web App" \
              --notes "Full production web/PWA bundle for Liquid Glass Studio. Web app only; no Android APK and no Windows MSIX."
          fi

      - name: Show release URL
        run: echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/web-latest"
