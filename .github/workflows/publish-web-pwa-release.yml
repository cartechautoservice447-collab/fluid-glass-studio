name: Publish Liquid Glass Studio Web PWA Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-web-pwa-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production web app
        run: npm run build

      - name: Verify web install assets
        shell: bash
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/pwa-icon-exact-192-new.png
          test -f dist/pwa-icon-exact-512-new.png
          grep -q 'pwa-icon-exact-192-new.png' dist/manifest.webmanifest
          grep -q 'pwa-icon-exact-512-new.png' dist/manifest.webmanifest

      - name: Create full web PWA bundle
        shell: bash
        run: |
          rm -rf release
          mkdir -p release
          cd dist
          zip -r ../release/Liquid-Glass-Studio-Web-PWA.zip .
          cd ..
          test -s release/Liquid-Glass-Studio-Web-PWA.zip

      - name: Create or update web release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view web-latest >/dev/null 2>&1; then
            gh release upload web-latest release/Liquid-Glass-Studio-Web-PWA.zip --clobber
          else
            gh release create web-latest \
              release/Liquid-Glass-Studio-Web-PWA.zip \
              --title "Liquid Glass Studio Web App" \
              --notes "Full production web/PWA bundle for Liquid Glass Studio. Web app only; no Android APK and no Windows MSIX."
          fi

      - name: Show release URL
        run: echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/web-latest"
