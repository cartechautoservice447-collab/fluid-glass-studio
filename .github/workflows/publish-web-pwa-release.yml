name: Publish Liquid Glass Studio Web PWA Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-web-pwa-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build production web app
        run: bun run build

      - name: Verify web install assets
        shell: bash
        run: |
          test -f dist/manifest.webmanifest
          grep -q 'pwa-icon-exact-192-new.png' dist/manifest.webmanifest
          grep -q 'pwa-icon-exact-512-new.png' dist/manifest.webmanifest

      - name: Create full web PWA bundle
        shell: bash
        run: |
          mkdir -p release
          cd dist
          zip -r ../release/Liquid-Glass-Studio-Web-PWA.zip .
          cd ..
          test -s release/Liquid-Glass-Studio-Web-PWA.zip

      - name: Create or update web release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view web-latest >/dev/null 2>&1; then
            gh release upload web-latest \
              release/Liquid-Glass-Studio-Web-PWA.zip \
              --clobber
          else
            gh release create web-latest \
              release/Liquid-Glass-Studio-Web-PWA.zip \
              --title "Liquid Glass Studio Web App" \
              --notes "Installable production web/PWA bundle for Liquid Glass Studio. This release is the web app only; it does not contain the Android APK or Windows MSIX."
          fi

      - name: Show web release URL
        run: |
          echo "Web PWA release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/web-latest"
          echo "Web PWA bundle: https://github.com/${GITHUB_REPOSITORY}/releases/download/web-latest/Liquid-Glass-Studio-Web-PWA.zip"
