name: Verify workspace templates

on:
  push:
    branches:
      - add-workspace-templates

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci: record workspace verification') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund > install.log 2>&1 || { cat install.log; exit 1; }
      - name: Run typecheck and record result
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          rc=$?
          {
            echo "TYPECHECK_EXIT=$rc"
            echo "--- typecheck ---"
            cat typecheck.log
          } > verification-result.txt
          exit 0
      - name: Run production build and record result
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          rc=$?
          {
            echo
            echo "BUILD_EXIT=$rc"
            echo "--- build ---"
            cat build.log
          } >> verification-result.txt
          exit 0
      - name: Record verification result in branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-result.txt
          git commit -m "ci: record workspace verification"
          git push
