name: Build Liquid Glass Studio Android APK FINAL

on:
  workflow_dispatch:

jobs:
  build-android-final:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate signing secrets
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_BASE64: ${{ secrets.BUBBLEWRAP_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          test -n "$BUBBLEWRAP_KEYSTORE_BASE64" || { echo "Missing BUBBLEWRAP_KEYSTORE_BASE64 GitHub secret."; exit 1; }
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" || { echo "Missing BUBBLEWRAP_KEYSTORE_PASSWORD GitHub secret."; exit 1; }
          test -n "$BUBBLEWRAP_KEY_PASSWORD" || { echo "Missing BUBBLEWRAP_KEY_PASSWORD GitHub secret."; exit 1; }

      - name: Install Bubblewrap CLI
        shell: bash
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Prepare persistent Android signing key
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_BASE64: ${{ secrets.BUBBLEWRAP_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android-twa
          printf '%s' "$BUBBLEWRAP_KEYSTORE_BASE64" | base64 --decode > android-twa/android.keystore
          test -s android-twa/android.keystore || { echo "Android keystore was not decoded."; exit 1; }

      - name: Initialize Trusted Web Activity project non-interactively
        shell: bash
        working-directory: android-twa
        env:
          PWA_MANIFEST_URL: https://fluid-glass-studio.lovable.app/manifest.webmanifest
        run: |
          rm -rf app gradle .gradle
          rm -f twa-manifest.json build.gradle gradle.properties gradlew gradlew.bat manifest-checksum.txt
          cat > init-answers.txt <<'EOF'
https://fluid-glass-studio.lovable.app
/
Liquid Glass Studio
Liquid Glass
com.liquidglassstudio.app
1


#07070c
#07070c
https://fluid-glass-studio.lovable.app/pwa-icon-512.svg
https://fluid-glass-studio.lovable.app/pwa-icon-512.svg



./android.keystore
android
EOF
          bubblewrap init --manifest="$PWA_MANIFEST_URL" --directory=. < init-answers.txt
          rm -f init-answers.txt

      - name: Validate generated TWA project
        shell: bash
        working-directory: android-twa
        run: |
          test -f twa-manifest.json || { echo "twa-manifest.json was not generated."; exit 1; }
          test -f android.keystore || { echo "Persistent android.keystore is missing."; exit 1; }
          test -f gradlew || { echo "Gradle wrapper was not generated."; exit 1; }
          grep -q 'com.liquidglassstudio.app' twa-manifest.json || { echo "Unexpected Android package ID."; exit 1; }
          grep -q 'Liquid Glass Studio' twa-manifest.json || { echo "Unexpected Android app name."; exit 1; }

      - name: Build signed APK and App Bundle
        shell: bash
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          bubblewrap build --signingKeyPath=./android.keystore --signingKeyAlias=android
          test -s app-release-signed.apk || { echo "Signed APK was not generated."; exit 1; }
          test -s app-release-bundle.aab || { echo "Signed App Bundle was not generated."; exit 1; }

      - name: Verify Android APK contents
        shell: bash
        working-directory: android-twa
        run: |
          command -v unzip >/dev/null
          unzip -l app-release-signed.apk | grep -q 'AndroidManifest.xml' || { echo "APK is missing AndroidManifest.xml."; exit 1; }
          unzip -l app-release-signed.apk | grep -q 'classes.dex' || { echo "APK is missing classes.dex."; exit 1; }

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp android-twa/app-release-signed.apk "release/Liquid Glass Studio.apk"
          cp android-twa/app-release-bundle.aab "release/Liquid Glass Studio.aab"
          test -s "release/Liquid Glass Studio.apk"
          test -s "release/Liquid Glass Studio.aab"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-android-final
          path: release/
