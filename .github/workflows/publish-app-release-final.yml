name: Publish Liquid Glass Studio App Release FINAL

on:
  workflow_dispatch:

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require successful platform builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          android_run=$(gh run list --workflow build-android-apk-final.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          windows_run=$(gh run list --workflow build-liquid-glass-studio-msix-final.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$android_run" || { echo "No successful final Android build found."; exit 1; }
          test -n "$windows_run" || { echo "No successful final Windows MSIX build found."; exit 1; }
          echo "ANDROID_RUN=$android_run" >> "$GITHUB_ENV"
          echo "WINDOWS_RUN=$windows_run" >> "$GITHUB_ENV"

      - name: Download Android artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/android
          gh run download "$ANDROID_RUN" --name liquid-glass-studio-android-final --dir release/android
          test -s "release/android/Liquid Glass Studio.apk" || { echo "Android APK artifact missing."; exit 1; }

      - name: Download Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/windows
          gh run download "$WINDOWS_RUN" --name liquid-glass-studio-msix-final --dir release/windows
          test -s "release/windows/Liquid Glass Studio.msix" || { echo "Windows MSIX artifact missing."; exit 1; }

      - name: Prepare stable release files
        shell: bash
        run: |
          mkdir -p release/final
          cp "release/android/Liquid Glass Studio.apk" "release/final/Liquid Glass Studio.apk"
          cp "release/windows/Liquid Glass Studio.msix" "release/final/Liquid Glass Studio.msix"
          test -s "release/final/Liquid Glass Studio.apk"
          test -s "release/final/Liquid Glass Studio.msix"

      - name: Create or update stable app release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest \
              "release/final/Liquid Glass Studio.apk" \
              "release/final/Liquid Glass Studio.msix" \
              --clobber
          else
            gh release create app-latest \
              "release/final/Liquid Glass Studio.apk" \
              "release/final/Liquid Glass Studio.msix" \
              --title "Liquid Glass Studio App" \
              --notes "Stable downloadable Android APK and Windows MSIX for Liquid Glass Studio."
          fi

      - name: Show stable download URLs
        shell: bash
        run: |
          echo "Android: https://github.com/${GITHUB_REPOSITORY}/releases/download/app-latest/Liquid%20Glass%20Studio.apk"
          echo "Windows: https://github.com/${GITHUB_REPOSITORY}/releases/download/app-latest/Liquid%20Glass%20Studio.msix"
