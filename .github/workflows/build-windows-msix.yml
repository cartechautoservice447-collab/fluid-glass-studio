name: Build Windows App Package

on:
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build project
        shell: pwsh
        run: |
          corepack enable
          npm install
          npm run build
      - name: Upload web build for Windows packaging
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-windows-source
          path: dist
