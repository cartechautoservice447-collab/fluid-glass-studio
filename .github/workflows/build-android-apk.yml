name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Android TWA
        env:
          PWA_URL: https://fluid-glass-studio.lovable.app
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          npm install --global @bubblewrap/cli@1.25.0
          mkdir -p android-twa
          bubblewrap init --manifest="${PWA_URL}/manifest.webmanifest" --directory=android-twa
          cd android-twa
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" || (echo "Missing keystore password secret" && exit 1)
          test -n "$BUBBLEWRAP_KEY_PASSWORD" || (echo "Missing key password secret" && exit 1)
          bubblewrap build
          mkdir -p ../release
          cp app-release-signed.apk "../release/Liquid Glass Studio.apk"
          cp app-release-bundle.aab "../release/Liquid Glass Studio.aab"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-android
          path: release/
