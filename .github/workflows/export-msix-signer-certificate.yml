name: Build and Sign Windows Local MSIX

on:
  workflow_dispatch:

jobs:
  build-sign-local:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows desktop host
        shell: pwsh
        run: |
          dotnet restore windows-app/LiquidGlassStudio.csproj
          dotnet publish windows-app/LiquidGlassStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o windows-app/publish

      - name: Prepare MSIX package
        shell: pwsh
        run: |
          Remove-Item windows-app/package -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item windows-app/release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path windows-app/package/Assets | Out-Null
          New-Item -ItemType Directory -Force -Path windows-app/release | Out-Null
          Copy-Item windows-app/publish/* windows-app/package/ -Recurse -Force
          Copy-Item windows-app/Package.appxmanifest windows-app/package/AppxManifest.xml -Force
          if (-not (Test-Path windows-app/package/'Liquid Glass Studio.exe')) { throw 'Published desktop executable missing.' }

      - name: Generate package icons
        shell: pwsh
        run: |
          npm install --global sharp-cli
          npx sharp-cli -i public/pwa-icon.svg -o windows-app/package/Assets/Square44x44Logo.png resize 44 44
          npx sharp-cli -i public/pwa-icon.svg -o windows-app/package/Assets/Square150x150Logo.png resize 150 150
          npx sharp-cli -i public/pwa-icon.svg -o windows-app/package/Assets/StoreLogo.png resize 50 50

      - name: Locate Windows SDK tools
        shell: pwsh
        run: |
          $roots = @(
            $env:WindowsSdkDir,
            $(if ($env:ProgramFiles) { Join-Path $env:ProgramFiles 'Windows Kits\10\bin' }),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin' })
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $makeAppx = $null
          $signTool = $null
          foreach ($root in $roots) {
            if (-not $makeAppx) {
              $makeAppx = Get-ChildItem -LiteralPath $root -Recurse -File -Filter MakeAppx.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\(x64|arm64)\\MakeAppx\.exe$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
            }
            if (-not $signTool) {
              $signTool = Get-ChildItem -LiteralPath $root -Recurse -File -Filter SignTool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\(x64|arm64)\\SignTool\.exe$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
            }
          }
          if (-not $makeAppx) { $makeAppx = Get-Command MakeAppx.exe -ErrorAction SilentlyContinue }
          if (-not $signTool) { $signTool = Get-Command SignTool.exe -ErrorAction SilentlyContinue }
          if (-not $makeAppx) { throw 'MakeAppx.exe not found.' }
          if (-not $signTool) { throw 'SignTool.exe not found.' }
          $makePath = if ($makeAppx.Path) { $makeAppx.Path } else { $makeAppx.FullName }
          $signPath = if ($signTool.Path) { $signTool.Path } else { $signTool.FullName }
          "MAKEAPPX_PATH=$makePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNTOOL_PATH=$signPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create unsigned MSIX
        shell: pwsh
        run: |
          Set-Location windows-app
          & $env:MAKEAPPX_PATH pack /v /o /d './package' /p './release/Liquid Glass Studio.msix' 2>&1 | Tee-Object -Variable packLog
          $exitCode = $LASTEXITCODE
          $packLog | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "MakeAppx failed with exit code $exitCode." }
          if (-not (Test-Path './release/Liquid Glass Studio.msix')) { throw 'MSIX was not generated.' }

      - name: Create local laptop signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=Liquid Glass Studio' `
            -FriendlyName 'Liquid Glass Studio Local Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -NotAfter (Get-Date).AddYears(5) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')

          $pfxPath = Join-Path $PWD 'Liquid Glass Studio Local Signing.pfx'
          $cerPath = Join-Path $PWD 'Liquid Glass Studio Local Signing.cer'
          $password = 'local-build-only'
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          Write-Host "Certificate subject: $($cert.Subject)"
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

      - name: Sign MSIX with local certificate
        shell: pwsh
        run: |
          Set-Location windows-app
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f '../Liquid Glass Studio Local Signing.pfx' /p 'local-build-only' './release/Liquid Glass Studio.msix'
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed with exit code $LASTEXITCODE." }

          $signature = Get-AuthenticodeSignature './release/Liquid Glass Studio.msix'
          Write-Host "Signature status: $($signature.Status)"
          Write-Host "Signer subject: $($signature.SignerCertificate.Subject)"
          if (-not $signature.SignerCertificate) { throw 'The signed MSIX has no signer certificate.' }
          if ($signature.SignerCertificate.Subject -ne 'CN=Liquid Glass Studio') {
            throw "Unexpected signer subject: $($signature.SignerCertificate.Subject)"
          }
          if ($signature.Status -eq 'NotSigned') { throw 'The MSIX is still unsigned.' }

      - name: Prepare laptop installation bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bundle | Out-Null
          Copy-Item 'windows-app/release/Liquid Glass Studio.msix' 'release-bundle/Liquid Glass Studio.msix' -Force
          Copy-Item 'Liquid Glass Studio Local Signing.cer' 'release-bundle/Liquid Glass Studio Local Signing.cer' -Force
          @'
          LIQUID GLASS STUDIO - WINDOWS LOCAL INSTALL

          1. Double-click "Liquid Glass Studio Local Signing.cer".
          2. Choose Install Certificate.
          3. Select Current User.
          4. Choose "Place all certificates in the following store".
          5. Select "Trusted People".
          6. Finish the certificate installation.
          7. Double-click "Liquid Glass Studio.msix" and install the app.

          This certificate is a local/testing certificate for this package. It is not a publicly trusted CA certificate.
          '@ | Set-Content 'release-bundle/INSTALL.txt' -Encoding UTF8
          Remove-Item 'Liquid Glass Studio Local Signing.pfx' -Force

      - name: Upload laptop installation bundle
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-windows-local-install
          path: release-bundle/
