name: Build Liquid Glass Studio MSIX

on:
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows app
        shell: pwsh
        run: |
          dotnet restore windows-app/LiquidGlassStudio.csproj
          dotnet publish windows-app/LiquidGlassStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o windows-app/publish

      - name: Prepare clean MSIX package staging folder
        shell: pwsh
        run: |
          Remove-Item windows-app/package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path windows-app/package/Assets | Out-Null
          Copy-Item public/pwa-icon.svg windows-app/package/Assets/pwa-icon.svg
          Copy-Item public/favicon.ico windows-app/package/Assets/favicon.ico
          Copy-Item windows-app/publish/* windows-app/package/ -Recurse -Force
          # MakeAppx requires the package manifest to be named AppxManifest.xml.
          Copy-Item windows-app/Package.appxmanifest windows-app/package/AppxManifest.xml -Force

      - name: Create PNG package icons from the existing PWA icon
        shell: pwsh
        run: |
          npm install --global sharp-cli
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/Square44x44Logo.png resize 44 44
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/Square150x150Logo.png resize 150 150
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/StoreLogo.png resize 50 50

      - name: Validate MSIX staging contents
        shell: pwsh
        run: |
          Set-Location windows-app
          $required = @(
            './package/AppxManifest.xml',
            './package/Liquid Glass Studio.exe',
            './package/Assets/StoreLogo.png',
            './package/Assets/Square150x150Logo.png',
            './package/Assets/Square44x44Logo.png'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required package file is missing: $path" }
          }
          Write-Host 'MSIX package manifest:'
          Get-Content './package/AppxManifest.xml'

      - name: Locate Windows SDK packaging tools
        shell: pwsh
        run: |
          $roots = @()
          if ($env:WindowsSdkDir) { $roots += $env:WindowsSdkDir }
          if ($env:ProgramFiles) { $roots += (Join-Path $env:ProgramFiles 'Windows Kits\10\bin') }
          if (${env:ProgramFiles(x86)}) { $roots += (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') }
          $roots = $roots | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $makeAppx = $null
          $signtool = $null
          foreach ($root in $roots) {
            if (-not $makeAppx) {
              $makeAppx = Get-ChildItem -LiteralPath $root -Recurse -File -Filter MakeAppx.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\(x64|arm64)\\MakeAppx\.exe$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
            }
            if (-not $signtool) {
              $signtool = Get-ChildItem -LiteralPath $root -Recurse -File -Filter SignTool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\(x64|arm64)\\SignTool\.exe$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
            }
          }
          if (-not $makeAppx) { $makeAppx = Get-Command MakeAppx.exe -ErrorAction SilentlyContinue }
          if (-not $signtool) { $signtool = Get-Command SignTool.exe -ErrorAction SilentlyContinue }
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found on the GitHub Windows runner.' }
          if (-not $signtool) { throw 'SignTool.exe was not found on the GitHub Windows runner.' }
          $makeAppxPath = if ($makeAppx.Path) { $makeAppx.Path } else { $makeAppx.FullName }
          $signtoolPath = if ($signtool.Path) { $signtool.Path } else { $signtool.FullName }
          "MAKEAPPX_PATH=$makeAppxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNTOOL_PATH=$signtoolPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using MakeAppx: $makeAppxPath"
          Write-Host "Using SignTool: $signtoolPath"

      - name: Create unsigned MSIX
        shell: pwsh
        run: |
          Set-Location windows-app
          Remove-Item ./release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path ./release | Out-Null
          Write-Host 'Running MakeAppx with manifest mapping...'
          $log = Join-Path $PWD 'makeappx.log'
          & $env:MAKEAPPX_PATH pack /o /d './package' /nv /v /p './release/Liquid Glass Studio.msix' *> $log
          $exitCode = $LASTEXITCODE
          Write-Host '----- MakeAppx diagnostic output -----'
          Get-Content $log -ErrorAction SilentlyContinue
          Write-Host '----- End MakeAppx diagnostic output -----'
          if ($exitCode -ne 0) { throw "MakeAppx.exe failed with exit code $exitCode. See full diagnostic output above." }
          if (-not (Test-Path './release/Liquid Glass Studio.msix')) { throw 'MSIX package was not generated.' }

      - name: Sign MSIX with configured certificate
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          Set-Location windows-app
          if (-not $env:WINDOWS_CERT_BASE64) {
            Write-Host 'WINDOWS_CERT_BASE64 not configured; keeping the MSIX unsigned for testing.'
            exit 0
          }
          [IO.File]::WriteAllBytes('./release-cert.pfx', [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f './release-cert.pfx' /p $env:WINDOWS_CERT_PASSWORD './release/Liquid Glass Studio.msix'
          if ($LASTEXITCODE -ne 0) { throw "SignTool.exe failed with exit code $LASTEXITCODE." }
          & $env:SIGNTOOL_PATH verify /pa './release/Liquid Glass Studio.msix'
          if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed with exit code $LASTEXITCODE." }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-msix
          path: windows-app/release/Liquid Glass Studio.msix
