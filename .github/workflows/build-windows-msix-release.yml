name: Build Liquid Glass Studio MSIX

on:
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows app
        shell: pwsh
        run: |
          dotnet restore windows-app/LiquidGlassStudio.csproj
          dotnet publish windows-app/LiquidGlassStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o windows-app/publish

      - name: Prepare package assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-app/package/Assets | Out-Null
          Copy-Item public/pwa-icon.svg windows-app/package/Assets/pwa-icon.svg
          Copy-Item public/favicon.ico windows-app/package/Assets/favicon.ico
          Copy-Item windows-app/publish/* windows-app/package/ -Recurse -Force
          Copy-Item windows-app/Package.appxmanifest windows-app/package/Package.appxmanifest -Force

      - name: Create PNG package icons from the existing PWA icon
        shell: pwsh
        run: |
          npm install --global sharp-cli
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/Square44x44Logo.png resize 44 44
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/Square150x150Logo.png resize 150 150
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/StoreLogo.png resize 50 50

      - name: Validate package inputs
        shell: pwsh
        run: |
          Set-Location windows-app
          if (-not (Test-Path './package/Package.appxmanifest')) { throw 'Package.appxmanifest is missing.' }
          if (-not (Test-Path './package/Liquid Glass Studio.exe')) { throw 'Published Liquid Glass Studio.exe is missing.' }
          foreach ($asset in @(
            './package/Assets/StoreLogo.png',
            './package/Assets/Square150x150Logo.png',
            './package/Assets/Square44x44Logo.png'
          )) {
            if (-not (Test-Path $asset)) { throw "Required package asset is missing: $asset" }
          }
          Write-Host 'MSIX package inputs validated.'

      - name: Locate Windows SDK packaging tools
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Recurse -Filter MakeAppx.exe |
            Where-Object { $_.FullName -match '\\x64\\MakeAppx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Recurse -Filter SignTool.exe |
            Where-Object { $_.FullName -match '\\x64\\SignTool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found in the installed Windows SDK.' }
          if (-not $signtool) { throw 'SignTool.exe was not found in the installed Windows SDK.' }
          "MAKEAPPX_PATH=$($makeAppx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using MakeAppx: $($makeAppx.FullName)"
          Write-Host "Using SignTool: $($signtool.FullName)"

      - name: Create unsigned MSIX with MakeAppx
        shell: pwsh
        run: |
          Set-Location windows-app
          New-Item -ItemType Directory -Force -Path ./release | Out-Null
          & $env:MAKEAPPX_PATH pack /o /d './package' /nv /p './release/Liquid Glass Studio.msix'
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx.exe failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path './release/Liquid Glass Studio.msix')) {
            throw 'MSIX package was not generated by MakeAppx.exe.'
          }

      - name: Sign MSIX with configured certificate
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          Set-Location windows-app
          if (-not $env:WINDOWS_CERT_BASE64) {
            Write-Host 'WINDOWS_CERT_BASE64 not configured; keeping the MSIX unsigned for testing.'
            exit 0
          }
          [IO.File]::WriteAllBytes('./release-cert.pfx', [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f './release-cert.pfx' /p $env:WINDOWS_CERT_PASSWORD './release/Liquid Glass Studio.msix'
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool.exe failed with exit code $LASTEXITCODE."
          }
          & $env:SIGNTOOL_PATH verify /pa './release/Liquid Glass Studio.msix'
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool verification failed with exit code $LASTEXITCODE."
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-msix
          path: windows-app/release/Liquid Glass Studio.msix
