name: Build Liquid Glass Studio MSIX

on:
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows app
        shell: pwsh
        run: |
          dotnet restore windows-app/LiquidGlassStudio.csproj
          dotnet publish windows-app/LiquidGlassStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o windows-app/publish

      - name: Install Windows App Development CLI
        shell: pwsh
        run: npm install -g @microsoft/winappcli

      - name: Prepare package assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-app/package/Assets | Out-Null
          Copy-Item public/pwa-icon.svg windows-app/package/Assets/pwa-icon.svg
          Copy-Item public/favicon.ico windows-app/package/Assets/favicon.ico
          Copy-Item windows-app/publish/* windows-app/package/ -Recurse -Force
          Copy-Item windows-app/Package.appxmanifest windows-app/package/Package.appxmanifest -Force

      - name: Create PNG package icons from the existing PWA icon
        shell: pwsh
        run: |
          npm install --global sharp-cli
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/Square44x44Logo.png resize 44 44
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/Square150x150Logo.png resize 150 150
          npx sharp-cli -i windows-app/package/Assets/pwa-icon.svg -o windows-app/package/Assets/StoreLogo.png resize 50 50

      - name: Validate package inputs
        shell: pwsh
        run: |
          Set-Location windows-app
          if (-not (Test-Path './package/Package.appxmanifest')) { throw 'Package.appxmanifest is missing.' }
          if (-not (Test-Path './package/Liquid Glass Studio.exe')) { throw 'Published Liquid Glass Studio.exe is missing.' }
          foreach ($asset in @(
            './package/Assets/StoreLogo.png',
            './package/Assets/Square150x150Logo.png',
            './package/Assets/Square44x44Logo.png'
          )) {
            if (-not (Test-Path $asset)) { throw "Required package asset is missing: $asset" }
          }
          Write-Host 'MSIX package inputs validated.'

      - name: Package MSIX
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          Set-Location windows-app
          New-Item -ItemType Directory -Force -Path ./release | Out-Null
          if ($env:WINDOWS_CERT_BASE64) {
            [IO.File]::WriteAllBytes('./release-cert.pfx', [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            winapp pack ./package --manifest ./package/Package.appxmanifest --output './release/Liquid Glass Studio.msix' --cert ./release-cert.pfx --cert-password $env:WINDOWS_CERT_PASSWORD --executable 'Liquid Glass Studio.exe'
          } else {
            Write-Host 'WINDOWS_CERT_BASE64 not configured; creating an unsigned test package.'
            winapp pack ./package --manifest ./package/Package.appxmanifest --output './release/Liquid Glass Studio.msix' --executable 'Liquid Glass Studio.exe'
          }
          if (-not (Test-Path './release/Liquid Glass Studio.msix')) {
            Write-Host 'Release directory contents:'
            Get-ChildItem ./release -Force | Format-List Name,Length,FullName
            throw 'MSIX package was not generated.'
          }
          Get-Item './release/Liquid Glass Studio.msix' | Format-List Name,Length,FullName

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-msix
          path: windows-app/release/Liquid Glass Studio.msix
