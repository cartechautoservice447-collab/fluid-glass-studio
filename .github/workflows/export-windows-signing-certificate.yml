name: Export Windows Signing Certificate

on:
  workflow_dispatch:

jobs:
  export-certificate:
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest successful Windows MSIX FINAL run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --workflow build-liquid-glass-studio-msix-final.yml --status success --limit 1 --json databaseId
          if (-not $runs) { throw 'No successful Build Liquid Glass Studio MSIX FINAL run was found.' }
          $run = $runs | ConvertFrom-Json
          if (-not $run.databaseId) { throw 'Could not determine the successful MSIX workflow run ID.' }
          "SOURCE_RUN_ID=$($run.databaseId)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using successful MSIX run $($run.databaseId)."

      - name: Download successful MSIX artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:SOURCE_RUN_ID --name liquid-glass-studio-msix-final --dir msix-artifact
          $msix = Get-ChildItem msix-artifact -Recurse -Filter 'Liquid Glass Studio.msix' | Select-Object -First 1
          if (-not $msix) { throw 'Liquid Glass Studio.msix was not found in the successful workflow artifact.' }
          Copy-Item $msix.FullName './Liquid Glass Studio.msix' -Force

      - name: Extract public signer certificate from MSIX signature
        shell: pwsh
        run: |
          $msixPath = Join-Path $PWD 'Liquid Glass Studio.msix'
          $cerPath = Join-Path $PWD 'Liquid Glass Studio Signer Certificate.cer'
          $signature = Get-AuthenticodeSignature -FilePath $msixPath
          if (-not $signature.SignerCertificate) {
            throw "The MSIX does not contain a signer certificate. Signature status: $($signature.Status)."
          }
          Export-Certificate -Cert $signature.SignerCertificate -FilePath $cerPath -Type CERT | Out-Null
          Write-Host "Certificate subject: $($signature.SignerCertificate.Subject)"
          Write-Host "Certificate thumbprint: $($signature.SignerCertificate.Thumbprint)"
          Write-Host "Certificate exported: $cerPath"

      - name: Upload public certificate
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-msix-signer-certificate
          path: Liquid Glass Studio Signer Certificate.cer
