name: Build Liquid Glass Studio MSIX FINAL

on:
  workflow_dispatch:

jobs:
  build-msix-final:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows desktop host
        shell: pwsh
        run: |
          dotnet restore windows-app/LiquidGlassStudio.csproj
          dotnet publish windows-app/LiquidGlassStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o windows-app/publish

      - name: Prepare clean MSIX content directory
        shell: pwsh
        run: |
          Remove-Item windows-app/package -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item windows-app/release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path windows-app/package/Assets | Out-Null
          New-Item -ItemType Directory -Force -Path windows-app/release | Out-Null
          Copy-Item windows-app/publish/* windows-app/package/ -Recurse -Force
          Copy-Item windows-app/Package.appxmanifest windows-app/package/AppxManifest.xml -Force

      - name: Generate required package icons
        shell: pwsh
        run: |
          npm install --global sharp-cli
          npx sharp-cli -i public/pwa-icon.svg -o windows-app/package/Assets/Square44x44Logo.png resize 44 44
          npx sharp-cli -i public/pwa-icon.svg -o windows-app/package/Assets/Square150x150Logo.png resize 150 150
          npx sharp-cli -i public/pwa-icon.svg -o windows-app/package/Assets/StoreLogo.png resize 50 50

      - name: Validate package manifest and assets
        shell: pwsh
        run: |
          Set-Location windows-app
          if (-not (Test-Path './package/AppxManifest.xml')) { throw 'AppxManifest.xml missing.' }
          if (-not (Test-Path './package/Liquid Glass Studio.exe')) { throw 'Published desktop executable missing.' }
          foreach ($path in @(
            './package/Assets/Square44x44Logo.png',
            './package/Assets/Square150x150Logo.png',
            './package/Assets/StoreLogo.png'
          )) {
            if (-not (Test-Path $path)) { throw "Required icon missing: $path" }
          }
          [xml]$manifest = Get-Content './package/AppxManifest.xml'
          if (-not $manifest.Package.Identity) { throw 'Manifest Identity element is missing.' }
          if (-not $manifest.Package.Applications.Application) { throw 'Manifest Application element is missing.' }
          if (-not $manifest.Package.Applications.Application.Executable) { throw 'Manifest Application Executable is missing.' }
          if (-not $manifest.Package.Capabilities.Capability -and -not $manifest.Package.Capabilities.'rescap:Capability') {
            Write-Host 'Capabilities element present; MakeAppx will perform final schema validation.'
          }
          Write-Host '--- MSIX manifest ---'
          Get-Content './package/AppxManifest.xml'
          Write-Host '--- package root files ---'
          Get-ChildItem './package' -File | Sort-Object Name | ForEach-Object { Write-Host $_.Name }

      - name: Locate MakeAppx and SignTool
        shell: pwsh
        run: |
          $candidateRoots = @(
            $env:WindowsSdkDir,
            $(if ($env:ProgramFiles) { Join-Path $env:ProgramFiles 'Windows Kits\10\bin' }),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin' })
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $makeAppx = $null
          $signTool = $null
          foreach ($root in $candidateRoots) {
            $found = Get-ChildItem -LiteralPath $root -Recurse -File -Filter MakeAppx.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\(x64|arm64)\\MakeAppx\.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) { $makeAppx = $found; break }
          }
          foreach ($root in $candidateRoots) {
            $found = Get-ChildItem -LiteralPath $root -Recurse -File -Filter SignTool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\(x64|arm64)\\SignTool\.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) { $signTool = $found; break }
          }
          if (-not $makeAppx) { $makeAppx = Get-Command MakeAppx.exe -ErrorAction SilentlyContinue }
          if (-not $signTool) { $signTool = Get-Command SignTool.exe -ErrorAction SilentlyContinue }
          if (-not $makeAppx) { throw 'MakeAppx.exe not found on windows-2022 runner.' }
          if (-not $signTool) { throw 'SignTool.exe not found on windows-2022 runner.' }

          $makePath = if ($makeAppx.Path) { $makeAppx.Path } else { $makeAppx.FullName }
          $signPath = if ($signTool.Path) { $signTool.Path } else { $signTool.FullName }
          "MAKEAPPX_PATH=$makePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNTOOL_PATH=$signPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "MakeAppx: $makePath"
          Write-Host "SignTool: $signPath"

      - name: Build unsigned MSIX from package directory
        shell: pwsh
        run: |
          Set-Location windows-app
          $output = (Resolve-Path './release').Path + '\Liquid Glass Studio.msix'
          Write-Host '--- Running MakeAppx from directory ---'
          & $env:MAKEAPPX_PATH pack /v /o /d './package' /p $output 2>&1 | Tee-Object -Variable packLog
          $exitCode = $LASTEXITCODE
          Write-Host '--- MakeAppx log ---'
          $packLog | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            Write-Host '--- Package directory listing ---'
            Get-ChildItem './package' -Recurse -File | Sort-Object FullName | ForEach-Object { Write-Host $_.FullName }
            throw "MakeAppx.exe failed with exit code $exitCode."
          }
          if (-not (Test-Path $output)) { throw 'Liquid Glass Studio.msix was not created.' }
          Get-Item $output | Format-List Name,Length,FullName

      - name: Sign and verify MSIX when certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          Set-Location windows-app
          if (-not $env:WINDOWS_CERT_BASE64) {
            Write-Host 'No WINDOWS_CERT_BASE64 secret configured; leaving package unsigned.'
            exit 0
          }
          [IO.File]::WriteAllBytes('./release-cert.pfx', [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f './release-cert.pfx' /p $env:WINDOWS_CERT_PASSWORD './release/Liquid Glass Studio.msix'
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed with exit code $LASTEXITCODE." }
          & $env:SIGNTOOL_PATH verify /pa './release/Liquid Glass Studio.msix'
          if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed with exit code $LASTEXITCODE." }

      - name: Upload Liquid Glass Studio.msix
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-msix-final
          path: windows-app/release/Liquid Glass Studio.msix
