name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Build standalone static app bundle
        run: |
          rm -rf dist android-dist
          npm run build -- --config vite.android.config.ts
          test -d dist/client
          mkdir -p android-dist
          cp -a dist/client/. android-dist/
          rm -rf dist
          mv android-dist dist
          if [ -f dist/_shell.html ]; then
            cp dist/_shell.html dist/index.html
          fi
          test -f dist/index.html

      - name: Install Capacitor tooling and native notifications
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications

      - name: Create bundled Capacitor Android app
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.liquidglassstudio.app',
            appName: 'Liquid Glass Studio',
            webDir: 'dist',
          };

          export default config;
          EOF
          npx cap add android
          npx cap sync android

      - name: Apply high quality rounded Liquid Glass Studio icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v convert
          RES="android/app/src/main/res"
          SOURCE="public/pwa-icon-exact-512.webp"
          rm -rf "$RES/mipmap-anydpi-v26"
          test -f "$SOURCE"
          identify "$SOURCE"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p "$RES/mipmap-$density"
            convert -background none "$SOURCE" -resize "${size}x${size}!" -strip "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done

      - name: Verify bundled Android app files
        run: |
          test -f android/capacitor.settings.gradle
          test -f android/app/capacitor.build.gradle
          test -f dist/index.html
          # Authentication callback URLs are data used by the auth flow and are
          # not a remote runtime. Only reject an actual Capacitor remote server.
          if grep -R -E "server[[:space:]]*:[[:space:]]*\\{|server\\.url|serverUrl" -n capacitor.config.ts android/app/src/main/assets/capacitor.config.json 2>/dev/null; then
            echo "Standalone APK must not configure a remote runtime server" >&2
            exit 1
          fi

      - name: Build installable standalone debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TAG="android-apk-${GITHUB_RUN_NUMBER}"
          TITLE="Liquid Glass Studio Standalone Android APK ${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "Standalone installable Liquid Glass Studio Android APK built from commit ${GITHUB_SHA}. The application bundle is packaged inside the APK and does not use a remote website as its runtime page. Includes native Android local notifications and the current rounded Liquid Glass icon." \
            --prerelease
