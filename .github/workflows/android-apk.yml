name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://fluid-glass-studio.lovable.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app URL
        run: |
          case "$APP_URL" in
            https://*) ;;
            *) echo "APP_URL must start with https://" >&2; exit 1 ;;
          esac

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Android wrapper
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.liquidglassstudio.app',
            appName: 'Liquid Glass Studio',
            webDir: 'dist',
            server: {
              url: process.env.APP_URL,
              cleartext: false,
            },
          };

          export default config;
          EOF
          npx cap add android

      - name: Apply uploaded Liquid Glass Studio icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v convert
          RES="android/app/src/main/res"
          ICON="public/pwa-icon-exact-512.webp"
          rm -rf "$RES/mipmap-anydpi-v26"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p "$RES/mipmap-$density"
            convert "$ICON" -resize "${size}x${size}!" -strip "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done

      - name: Verify Capacitor Android Gradle files
        run: |
          test -f android/capacitor.settings.gradle
          test -f android/capacitor.build.gradle

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-studio-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
