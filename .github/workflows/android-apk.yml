name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://fluid-glass-studio.lovable.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app URL
        run: |
          case "$APP_URL" in
            https://*) ;;
            *) echo "APP_URL must start with https://" >&2; exit 1 ;;
          esac

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Android wrapper
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.liquidglassstudio.app',
            appName: 'Liquid Glass Studio',
            webDir: 'dist',
            server: {
              url: process.env.APP_URL,
              cleartext: false,
            },
          };

          export default config;
          EOF
          mkdir -p dist
          printf '<!doctype html><html><head><meta charset="utf-8"><title>Liquid Glass Studio</title></head><body></body></html>' > dist/index.html
          npx cap add android
          npx cap sync android

      - name: Apply high quality rounded Liquid Glass Studio icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v convert
          RES="android/app/src/main/res"
          SOURCE="public/pwa-icon-exact-192.webp"
          rm -rf "$RES/mipmap-anydpi-v26"
          test -f "$SOURCE"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p "$RES/mipmap-$density"
            TMP="/tmp/icon-$density.png"
            MASK="/tmp/mask-$density.png"
            convert "$SOURCE" -resize "${size}x${size}!" -strip "$TMP"
            radius=$((size*26/192))
            convert -size "${size}x${size}" xc:none -fill white -draw "roundrectangle 0,0 $((size-1)),$((size-1)) $radius,$radius" "$MASK"
            convert "$TMP" "$MASK" -alpha off -compose CopyOpacity -composite -strip "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done

      - name: Verify Capacitor Android Gradle files
        run: |
          test -f android/capacitor.settings.gradle
          test -f android/app/capacitor.build.gradle

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TAG="android-apk-${GITHUB_RUN_NUMBER}"
          TITLE="Liquid Glass Studio Android APK ${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "Installable Liquid Glass Studio Android APK built from commit ${GITHUB_SHA}. Includes the current high quality rounded Liquid Glass icon." \
            --prerelease
