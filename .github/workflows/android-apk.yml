name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Build standalone static app bundle
        run: |
          rm -rf dist android-dist
          npm run build -- --config vite.android.config.ts
          test -d dist/client
          mkdir -p android-dist
          cp -a dist/client/. android-dist/
          rm -rf dist
          mv android-dist dist
          if [ -f dist/_shell.html ]; then
            cp dist/_shell.html dist/index.html
          fi
          test -f dist/index.html

      - name: Install Capacitor tooling and native notifications
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications esbuild

      - name: Add Android-only native notification bootstrap
        run: |
          test -f scripts/android-notifications-bootstrap.js
          node --input-type=module <<'NODE'
          import { build } from "esbuild";
          await build({
            entryPoints: ["scripts/android-notifications-bootstrap.js"],
            bundle: true,
            format: "esm",
            platform: "browser",
            minify: true,
            outfile: "dist/android-notifications-bootstrap.js",
          });
          NODE
          test -s dist/android-notifications-bootstrap.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("dist/index.html")
          html = path.read_text()
          marker = '<script type="module" src="/android-notifications-bootstrap.js"></script>'
          if marker not in html:
              html = html.replace("</head>", f"{marker}</head>", 1)
          path.write_text(html)
          PY
          grep -q 'android-notifications-bootstrap.js' dist/index.html

      - name: Create bundled Capacitor Android app
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.liquidglassstudio.app',
            appName: 'Liquid Glass Studio',
            webDir: 'dist',
          };

          export default config;
          EOF
          npx cap add android
          npx cap sync android

      - name: Ensure Android notification runtime permissions are declared
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          if ! grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' "$MANIFEST"
          fi
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$MANIFEST"

      - name: Add Android notification icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v convert
          RES="android/app/src/main/res"
          SOURCE="public/pwa-icon-exact-512.webp"
          test -f "$SOURCE"
          mkdir -p "$RES/drawable"
          # Notification small icons must be simple alpha/white artwork rather than
          # the full-color launcher icon.
          convert "$SOURCE" -alpha extract -threshold 8% -fill white -colorize 100% -strip "$RES/drawable/ic_stat_pomodoro.png"
          test -s "$RES/drawable/ic_stat_pomodoro.png"

      - name: Optimize Android release APK for smaller size
        run: |
          APP_GRADLE="android/app/build.gradle"
          test -f "$APP_GRADLE"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          old = """release {\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n        }"""
          new = """release {\n            minifyEnabled true\n            shrinkResources true\n            signingConfig signingConfigs.debug\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n        }"""
          if old not in text:
              raise SystemExit("Expected Capacitor release block was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          grep -A5 -n 'release {' "$APP_GRADLE"

      - name: Apply high quality rounded Liquid Glass Studio icon
        run: |
          RES="android/app/src/main/res"
          SOURCE="public/pwa-icon-exact-512.webp"
          test -f "$SOURCE"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p "$RES/mipmap-$density"
            convert -background none "$SOURCE" -resize "${size}x${size}!" -strip "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done

      - name: Verify bundled Android app files
        run: |
          test -f android/capacitor.settings.gradle
          test -f android/app/capacitor.build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/ic_stat_pomodoro.png
          test -f dist/index.html
          test -s dist/android-notifications-bootstrap.js
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          # Authentication callback URLs are data used by the auth flow and are
          # not a remote runtime. Only reject an actual Capacitor remote server.
          if grep -R -E "server[[:space:]]*:[[:space:]]*\\{|server\\.url|serverUrl" -n capacitor.config.ts android/app/src/main/assets/capacitor.config.json 2>/dev/null; then
            echo "Standalone APK must not configure a remote runtime server" >&2
            exit 1
          fi

      - name: Build installable standalone release APK
        working-directory: android
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK size and installation package
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          du -h "$APK"

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TAG="android-apk-${GITHUB_RUN_NUMBER}"
          TITLE="Liquid Glass Studio Standalone Android APK ${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "Standalone installable Liquid Glass Studio Android APK built from commit ${GITHUB_SHA}. The application bundle is packaged inside the APK and does not use a remote website as its runtime page. Android-only native local notifications are bundled with a dedicated notification channel, notification icon, runtime permission, and scheduled background delivery. The Android build also includes the Android-only Mobile/Laptop device mode switch. The release build is optimized for a smaller APK." \
            --prerelease
