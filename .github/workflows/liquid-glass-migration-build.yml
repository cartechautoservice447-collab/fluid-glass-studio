name: Verify Liquid Glass Migration

on:
  push:
    branches:
      - liquid-glass-engine-migration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capture environment
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee migration-build-log.txt

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a migration-build-log.txt

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-migration-build-log
          path: migration-build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if install or build failed
        if: steps.install.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
