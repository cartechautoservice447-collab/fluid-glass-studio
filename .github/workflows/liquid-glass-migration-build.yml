name: Verify Liquid Glass Migration

on:
  push:
    branches:
      - liquid-glass-engine-migration
    paths-ignore:
      - migration-build-log.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund 2>&1 | tee migration-build-log.txt

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee -a migration-build-log.txt

      - name: Commit diagnostic build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-build-log.txt
          git commit -m "ci: record migration build failure"
          git push

      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
