name: Publish Liquid Glass Studio Windows Release FINAL

on:
  workflow_run:
    workflows: ["Build Liquid Glass Studio Windows Local FINAL"]
    types: [completed]

env:
  RELEASE_TAG: windows-final-${{ github.run_id }}

jobs:
  publish-windows:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed Windows local-final bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download $env:SOURCE_RUN_ID --name liquid-glass-studio-windows-local-final --dir release
          $msix = Get-ChildItem release -Recurse -Filter 'Liquid Glass Studio.msix' | Select-Object -First 1
          $cer = Get-ChildItem release -Recurse -Filter 'Liquid Glass Studio Local Signing.cer' | Select-Object -First 1
          $install = Get-ChildItem release -Recurse -Filter 'INSTALL.txt' | Select-Object -First 1
          if (-not $msix) { throw 'Liquid Glass Studio.msix was not found in the local-final artifact.' }
          if (-not $cer) { throw 'Liquid Glass Studio Local Signing.cer was not found in the local-final artifact.' }
          if (-not $install) { throw 'INSTALL.txt was not found in the local-final artifact.' }
          New-Item -ItemType Directory -Force -Path release/final | Out-Null
          Copy-Item $msix.FullName 'release/final/Liquid Glass Studio.msix' -Force
          Copy-Item $cer.FullName 'release/final/Liquid Glass Studio Local Signing.cer' -Force
          Copy-Item $install.FullName 'release/final/INSTALL.txt' -Force

      - name: Validate release package
        shell: pwsh
        run: |
          $msix = Get-Item 'release/final/Liquid Glass Studio.msix'
          if ($msix.Length -lt 100KB) { throw "MSIX artifact is unexpectedly small: $($msix.Length) bytes." }
          Write-Host "Validated $($msix.Name), size $($msix.Length) bytes."

      - name: Zip the Windows install bundle
        shell: pwsh
        run: |
          Compress-Archive -Path 'release/final/Liquid Glass Studio.msix','release/final/Liquid Glass Studio Local Signing.cer','release/final/INSTALL.txt' -DestinationPath 'release/Liquid-Glass-Studio-Windows.zip' -Force

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            'release/Liquid-Glass-Studio-Windows.zip' `
            --title "Liquid Glass Studio Windows" `
            --notes 'Windows desktop release of Liquid Glass Studio. Contains the MSIX, a local trust certificate, and INSTALL.txt. Import the certificate before installing the MSIX.'
