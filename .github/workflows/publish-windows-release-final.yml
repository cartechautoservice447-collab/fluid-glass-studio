name: Publish Liquid Glass Studio Windows Release FINAL

on:
  workflow_dispatch:

env:
  RELEASE_TAG: windows-final-${{ github.run_number }}

jobs:
  publish-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows MSIX artifact from latest successful FINAL run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --workflow build-liquid-glass-studio-msix-final.yml --status success --limit 1 --json databaseId,headSha
          if (-not $runs) { throw 'No successful Windows MSIX FINAL workflow run was found.' }
          $run = $runs | ConvertFrom-Json
          if (-not $run) { throw 'Could not determine the latest successful Windows MSIX run.' }
          Write-Host "Using MSIX run $($run.databaseId) from commit $($run.headSha)."
          gh run download $run.databaseId --name liquid-glass-studio-msix-final --dir release
          $msix = Get-ChildItem release -Recurse -Filter 'Liquid Glass Studio.msix' | Select-Object -First 1
          if (-not $msix) { throw 'Liquid Glass Studio.msix was not found in the downloaded artifact.' }
          New-Item -ItemType Directory -Force -Path release/final | Out-Null
          Copy-Item $msix.FullName 'release/final/Liquid Glass Studio.msix' -Force

      - name: Validate release package
        shell: pwsh
        run: |
          $msix = Get-Item 'release/final/Liquid Glass Studio.msix'
          if ($msix.Length -lt 100KB) { throw "MSIX artifact is unexpectedly small: $($msix.Length) bytes." }
          Write-Host "Validated $($msix.Name), size $($msix.Length) bytes."

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            'release/final/Liquid Glass Studio.msix' `
            --title "Liquid Glass Studio Windows $env:GITHUB_RUN_NUMBER" `
            --notes 'Windows desktop release of Liquid Glass Studio. Existing website features are unchanged; this release contains the separate Windows MSIX package.'
