name: Publish Liquid Glass Studio Windows Release FINAL

on:
  workflow_run:
    workflows: ["Build Liquid Glass Studio MSIX FINAL"]
    types: [completed]

env:
  RELEASE_TAG: windows-final-${{ github.run_id }}

jobs:
  publish-windows:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download successful Windows MSIX artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download $env:SOURCE_RUN_ID --name liquid-glass-studio-msix-final --dir release
          $msix = Get-ChildItem release -Recurse -Filter 'Liquid Glass Studio.msix' | Select-Object -First 1
          if (-not $msix) { throw 'Liquid Glass Studio.msix was not found in the successful MSIX workflow artifact.' }
          New-Item -ItemType Directory -Force -Path release/final | Out-Null
          Copy-Item $msix.FullName 'release/final/Liquid Glass Studio.msix' -Force

      - name: Validate release package
        shell: pwsh
        run: |
          $msix = Get-Item 'release/final/Liquid Glass Studio.msix'
          if ($msix.Length -lt 100KB) { throw "MSIX artifact is unexpectedly small: $($msix.Length) bytes." }
          Write-Host "Validated $($msix.Name), size $($msix.Length) bytes."

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            'release/final/Liquid Glass Studio.msix' `
            --title "Liquid Glass Studio Windows" `
            --notes 'Windows desktop release of Liquid Glass Studio. Existing website features are unchanged; this release contains the separate Windows MSIX package.'
