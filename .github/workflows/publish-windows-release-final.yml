name: Publish Liquid Glass Studio Windows Release FINAL

# Windows releases are now published directly by the Windows build workflow.
# This legacy workflow is kept manual-only so it cannot start a second release
# or depend on the Actions artifact quota.
on:
  workflow_dispatch:

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Legacy workflow notice
        run: echo "Windows releases are published by build-liquid-glass-studio-windows-local-final.yml"
